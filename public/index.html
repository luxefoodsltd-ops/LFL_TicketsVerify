<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxe Foods Ticket Verification</title><style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px}.wrap{max-width:560px;margin:auto}.card{background:#1d1d1d;border:1px solid #6f5420;border-radius:16px;padding:18px;margin:14px 0}h1{margin:0 0 6px;font-size:25px;color:#f4d37a}h2{font-size:18px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #777;font-size:16px}button{background:#d7a928;border:0;font-weight:700;cursor:pointer}.secondary{background:#333;color:#fff;border:1px solid #666}.status{padding:18px;border-radius:12px;margin-top:12px;text-align:center;font-size:20px;font-weight:700}.valid{background:#153c22}.used{background:#5a3b08}.invalid{background:#501c1c}.muted{color:#bbb;font-size:13px}.hidden{display:none}.ticket{font-size:28px;color:#f4d37a}</style></head><body><div class="wrap">
<div class="card"><h1>Luxe Foods Cafe & Grill</h1><div>The Opening Taste Experience · 1 November 2026 · 5:00 PM</div></div>
<div class="card" id="loginCard"><h2>Staff Login</h2><input id="email" type="email" placeholder="Staff email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="loginMsg" class="muted"></div></div>
<div class="card hidden" id="scanCard"><h2>Scan Ticket</h2><button onclick="startScanner()">Start QR Scanner</button><div id="reader"></div><input id="manual" placeholder="Manual QR payload or ticket ID"><button class="secondary" onclick="verifyManual()">Verify</button><div id="decoded" class="muted"></div><div id="result"></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="config.js"></script><script>
const APP_CONFIG = window.CONFIG || {};
const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const loginMsgEl = document.getElementById('loginMsg');
const loginCardEl = document.getElementById('loginCard');
const scanCardEl = document.getElementById('scanCard');
const manualEl = document.getElementById('manual');
const decodedEl = document.getElementById('decoded');
const resultEl = document.getElementById('result');
let sb = null;
let scanner=null;

function parse(v){v=(v||'').trim(); const p=v.split('|'); if(p.length===3&&p[0]==='LUXEFOODS') return {ticket_id:p[1],qr_token:p[2],raw:v}; const m=v.match(/^(WALNUT|MAHOGANY)-\d{3}$/); if(m) return {ticket_id:v,qr_token:'',raw:v}; return {ticket_id:'',qr_token:'',raw:v};}

function ensureConfig(){
  if(!APP_CONFIG.SUPABASE_URL || APP_CONFIG.SUPABASE_URL.includes('YOUR_PROJECT')){
    loginMsgEl.textContent='Supabase has not been contacted. public/config.js needs the real Project URL from Supabase > Project Settings > API (for example, https://abcdefgh.supabase.co). The login credentials are not the cause of this message.';
    return false;
  }
  if(!APP_CONFIG.SUPABASE_ANON_KEY || APP_CONFIG.SUPABASE_ANON_KEY.includes('YOUR_')){
    loginMsgEl.textContent='Add the project publishable key (or anon key) from Supabase > Project Settings > API to public/config.js.';
    return false;
  }
  if(!APP_CONFIG.VERIFY_FUNCTION_URL || APP_CONFIG.VERIFY_FUNCTION_URL.includes('YOUR_PROJECT')){
    loginMsgEl.textContent='Add the verify-ticket Edge Function URL for the same Supabase project to public/config.js.';
    return false;
  }

  let projectUrl;
  let functionUrl;
  try {
    projectUrl = new URL(APP_CONFIG.SUPABASE_URL);
    functionUrl = new URL(APP_CONFIG.VERIFY_FUNCTION_URL);
  } catch {
    loginMsgEl.textContent='The Supabase URLs in public/config.js are invalid.';
    return false;
  }

  if(projectUrl.protocol !== 'https:' || !projectUrl.hostname.endsWith('.supabase.co') || projectUrl.hostname.startsWith('sb_publishable_')){
    loginMsgEl.textContent='The Supabase Project URL is incorrect. Copy the Project URL from Supabase > Project Settings > API; do not use a key as the project name.';
    return false;
  }
  if(functionUrl.protocol !== 'https:' || functionUrl.origin !== projectUrl.origin || functionUrl.pathname !== '/functions/v1/verify-ticket'){
    loginMsgEl.textContent='The function URL must be https://<project-ref>.supabase.co/functions/v1/verify-ticket for this same Supabase project.';
    return false;
  }
  if(!window.supabase || !window.supabase.createClient){
    loginMsgEl.textContent='Supabase login library did not load. Check your internet connection and reload this page.';
    return false;
  }
  return true;
}

async function login(){
  try {
    if(!ensureConfig()) return;

    const email = (emailEl.value || '').trim();
    const password = passwordEl.value || '';
    if(!email || !password){
      loginMsgEl.textContent = 'Enter staff email and password.';
      return;
    }

    loginMsgEl.textContent = 'Signing in...';
    sb = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error){
      loginMsgEl.textContent = error.message || 'Login failed.';
      return;
    }

    loginMsgEl.textContent = 'Signed in.';
    loginCardEl.classList.add('hidden');
    scanCardEl.classList.remove('hidden');
  } catch (error) {
    loginMsgEl.textContent = error && error.message ? error.message : 'Unexpected login error.';
  }
}

async function verify(raw){try{const p=parse(raw);decodedEl.textContent='Decoded: '+(p.ticket_id||raw); if(!p.ticket_id||!p.qr_token){show('INVALID','This is not a secure Luxe Foods QR code.','invalid');return;} if(!sb){show('INVALID','Please sign in before verifying tickets.','invalid');return;} const {data:{session}}=await sb.auth.getSession(); if(!session){show('INVALID','Please sign in again.','invalid');return;} const r=await fetch(APP_CONFIG.VERIFY_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({ticket_id:p.ticket_id,qr_token:p.qr_token,qr_payload:p.raw})}); const j=await r.json(); if(j.result==='VALID')show('ENTRY GRANTED',j.ticket_id+' · '+j.ticket_type+' · Le '+Number(j.price).toLocaleString(),'valid'); else if(j.result==='ALREADY_USED')show('ALREADY USED',j.ticket_id+' was already checked in.', 'used'); else show('INVALID',j.message||'Ticket not recognized.','invalid');}catch(error){show('INVALID',error && error.message ? error.message : 'Verification failed.','invalid');}}

function verifyManual(){verify(manualEl.value)}
function show(a,b,c){resultEl.innerHTML='<div class="status '+c+'"><div>'+a+'</div><div class="ticket">'+b+'</div></div>'}
function startScanner(){if(scanner) return; if(!window.Html5Qrcode){show('CAMERA ERROR','The QR scanner library did not load.','invalid');return;} scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:260}},txt=>{scanner.stop().then(()=>{scanner=null;verify(txt)}).catch(()=>{scanner=null;verify(txt)});},()=>{}).catch(e=>show('CAMERA ERROR',e,'invalid'));}
</script></body></html>
